# ==============================================================================
# NGINX HIGH-PERFORMANCE LOAD BALANCER & REVERSE PROXY CONFIGURATION
# Fleet Maintenance & Vehicle Utilization Management Platform
# ==============================================================================

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance Tuning & I/O optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for Fast Transmission
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting: Prevent DDoS and API flooding
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=50r/s;

    # -------------------------------------------------------------------------
    # UPSTREAM LOAD BALANCING POOL (Horizontal Scaling Architecture)
    # -------------------------------------------------------------------------
    upstream fleet_backend_cluster {
        # Strategy: least_conn (routes traffic to the server with fewest active connections)
        least_conn;

        server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4003 max_fails=3 fail_timeout=10s;

        keepalive 64;
    }

    # Upstream pool for WebSocket sticky sessions
    upstream fleet_websocket_cluster {
        ip_hash; # Sticky routing for real-time WebSocket connections
        server 127.0.0.1:4001;
        server 127.0.0.1:4002;
        server 127.0.0.1:4003;
    }

    # -------------------------------------------------------------------------
    # PRIMARY SERVER BLOCK
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost fleet.internal;

        # Client body limit (allow receipt uploads up to 10MB)
        client_max_body_size 10M;

        # 1. Health Check Endpoint (For AWS ALB / GCP Load Balancers)
        location /health {
            access_log off;
            proxy_pass http://fleet_backend_cluster/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. REST API Reverse Proxy with Rate Limiting & Load Balancing
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;

            proxy_pass http://fleet_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 3. Real-Time WebSockets (Socket.IO) Proxy with Upgraded Headers
        location /socket.io/ {
            proxy_pass http://fleet_websocket_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket idle timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. Frontend SPA Serving (Static build files)
        location / {
            root /var/www/fleet-frontend/dist;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
