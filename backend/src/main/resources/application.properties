spring.application.name=fleet-management-backend
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fleet_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Security & JWT Configuration
fleetops.jwt.secret=9a3b6c8d1e4f7a2b5c8e0d3f6a9c2e5b8d1f4a7c0e3b6d9f2a5c8e1d4f7a0b3c
fleetops.jwt.expiration-ms=86400000

# CORS Configuration
fleetops.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Business Engine Configuration
fleetops.maintenance.warning-km-threshold=500
fleetops.maintenance.warning-days-threshold=14

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
